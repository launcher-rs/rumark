# workspace 根：rumark 主 crate 自身是根包成员。
# [profile.*] 只能在 workspace 根定义，保留在本文件。
[workspace]
members = ["."]
resolver = "3"

[package]
name = "rumark"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
description = "拾墨 Rumark：基于 rgpui 的块式 Markdown 编辑器"
repository = "https://github.com/launcher-rs/rumark"

# 拾墨 Rumark：基于 rgpui 的块式 Markdown 编辑器。
# 重型特性（代码高亮/tree-sitter 等）由 `#[cfg(feature = ...)]` 自动裁剪对应模块。

[dependencies]
anyhow = "1"
base64 = "0.23"
uuid = "1.23"
rgpui = { version = "1.7", features = ["inspector"] }
rgpui-platform = { version = "1.7" }
unicode-segmentation = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
futures = "0.3"
toml = "1"
url = "2"
pulldown-cmark = "0.13"
cssparser = "0.37"
directories = "6"
ratex-layout = "0.1.9"
ratex-parser = "0.1.9"
ratex-svg = { version = "0.1.9", features = ["embed-fonts", "standalone"] }
# Mermaid 渲染库已拆分为独立仓（launcher-rs/mermaid-renderer），以 git 依赖引入。
# 本地改动请在该仓提交，再回本仓执行 `cargo update -p mermaid-renderer` 更新锁文件。
mermaid-renderer = { git = "https://github.com/launcher-rs/mermaid-renderer", branch = "main" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }
sys-locale = "0.3"
docx-rs = { version = "0.4", optional = true }
printpdf = { version = "0.12", default-features = false, features = ["text_layout"], optional = true }
# 导出嵌图解码用：已在依赖树内（docx-rs/rgpui 均引入），不新增编译负担。
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
tree-sitter = { version = "=0.26.12", optional = true }
tree-sitter-highlight = { version = "=0.26.12", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-json = { version = "=0.24.8", optional = true }
tree-sitter-md = { version = "=0.5.3", optional = true }
tree-sitter-bash = { version = "=0.25.1", optional = true }
tree-sitter-c = { version = "=0.24.2", optional = true }
tree-sitter-cpp = { version = "=0.23.4", optional = true }
tree-sitter-c-sharp = { version = "=0.23.5", optional = true }
tree-sitter-css = { version = "=0.25.0", optional = true }
tree-sitter-go = { version = "=0.25.0", optional = true }
tree-sitter-html = { version = "=0.23.2", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
tree-sitter-php = { version = "=0.24.2", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-ruby = { version = "=0.23.1", optional = true }
tree-sitter-yaml = { version = "=0.7.2", optional = true }
tree-sitter-toml = { package = "adot-tree-sitter-toml", version = "=0.1.0", optional = true }

[features]
default = ["code-highlight-core", "code-highlight-official", "code-highlight-config", "html-native", "export-pdf", "export-docx"]
# 导出功能按格式独立门控：最小构建用 `--no-default-features` 裁掉两者。
export-pdf = ["dep:printpdf", "dep:image"]
export-docx = ["dep:docx-rs", "dep:image"]
code-highlight-core = ["dep:tree-sitter", "dep:tree-sitter-highlight"]
html-native = ["dep:tree-sitter", "dep:tree-sitter-html"]
code-highlight-official = [
    "code-highlight-core",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-md",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-css",
    "dep:tree-sitter-go",
    "dep:tree-sitter-html",
    "dep:tree-sitter-java",
    "dep:tree-sitter-php",
    "dep:tree-sitter-python",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-yaml",
]
code-highlight-config = ["dep:tree-sitter-toml"]

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
rgpui = { version = "1.7", features = ["test-support"] }
# 仅测试用：解包生成的 docx 校验 document.xml 结构，不进正式构建。
zip = "2"

# 本 crate 开一档优化：块布局、文本测量与逐帧重绘这些热路径在 opt-level 0 下慢
# 一个数量级；opt-level 1 相比 2 的运行时差别很小，但增量编译快得多。
[profile.dev]
opt-level = 1

# 框架 crate 单独提到最高档：渲染与布局的每次调用都压在它们的开销上。
[profile.dev.package]
rgpui = { opt-level = 3 }
rgpui-macros = { opt-level = 3 }

# 日常 `cargo run` 也把其余依赖按优化编译：Markdown 解析、tree-sitter 高亮、数学
# 与 Mermaid 渲染这些库在 opt-level 0 下开销明显，首屏会逐行刷出、拖动时也掉帧。
[profile.dev.package."*"]
opt-level = 2

# release 优化
# 日常发版用 thin LTO（构建快）；打安装包用下面的 size 档（体积最小）。
[profile.release]
# 最高优化等级，热路径都在 CPU 侧：逐帧重绘、语法高亮、导出渲染。
opt-level = 3
# 跨 crate 内联 + 死代码消除，增量代价可接受。
lto = "thin"
# 单代码生成单元，配合 LTO 进一步内联，牺牲并行编译速度换运行速度。
codegen-units = 1
# 剥离符号表，减小发布包体积。
strip = true

# size 档：只用于打安装包（构建慢，体积最小）。
[profile.size]
inherits = "release"
# 体积优先。
opt-level = "z"
# fat LTO：比 thin 更彻底的跨 crate 内联与死代码消除。
lto = true
codegen-units = 1
strip = true
