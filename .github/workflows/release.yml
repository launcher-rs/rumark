# 双模式发布（同一个 job，两种目标）：
#   推 `v*` 标签 → 正式版本归档：release 名与 git tag 都是该版本号，不碰 latest，编译档固定 size。
#   手动 workflow_dispatch → 滚动 `latest`：全平台触发删旧建新，单平台触发只替换该平台附件。
# 各平台编完即传附件，互不等待；Windows 必过，Linux/macOS 尽力而为。
name: release

on:
  # 正式版本发布：打 tag 即触发，无需手动点按钮。
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: '编译档'
        required: false
        default: 'size'
        type: choice
        options: [size, release]
      platform:
        description: '编译平台（单选某平台可单独重编，不碰其他平台附件）'
        required: false
        default: 'all'
        type: choice
        options: [all, windows, linux, macos]

permissions:
  contents: write

# 发版串行：tag 发版与手动 latest 发版（或两次手动触发）同时跑会互相覆盖同名附件。
# 故意 cancel-in-progress=false：跑到一半的发版不能被取消，宁可排队等上一个结束。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 先建好目标 Release，各平台 job 只管往里传附件：早编完早发布，不用等最慢的。
  # 顺带算出本次要跑的矩阵（job 级 if 不支持 matrix，只能走 outputs 动态矩阵），
  # 并把发布目标（tag 名 + 编译档）在这里一次定稿：两种触发方式的差异全收口在本 job，
  # 下面的 build job 只消费 outputs，不再区分自己是被谁触发的。
  prepare:
    name: 准备 Release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4

      - name: 定发布目标与矩阵
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # tag 触发 = 正式版本：目标就是 tag 名本身，size 档（发布包体积优先）。
            tag="$REF"
            prof='size'
            # platform 输入在 tag 事件下为空，走下面的默认分支 = 全平台。
            # 版本一致性校验：release 标题与 exe 的 --version 都取自 Cargo.toml，
            # 对不上说明标签打错，宁可在这里挡住，也不要发出去一个标着 0.3.0、实际 --version 打 0.2.0 的包。
            crate=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
            if [ "${tag#v}" != "$crate" ]; then
              echo "::error::标签 $tag 与 Cargo.toml 版本 $crate 不一致：先改版本号（含 Cargo.lock）再打 tag"
              exit 1
            fi
          else
            # 手动触发 = 滚动 latest，编译档按选择来。
            tag='latest'
            prof="${INPUT_PROFILE:-size}"
          fi

          win='{"id":"windows","os":"windows-latest","name":"windows-x86_64","best-effort":false}'
          lin='{"id":"linux","os":"ubuntu-22.04","name":"linux-x86_64","best-effort":true}'
          mac='{"id":"macos","os":"macos-latest","name":"macos-aarch64","best-effort":true}'
          case "$INPUT_PLATFORM" in
            windows) m="[$win]" ;;
            linux) m="[$lin]" ;;
            macos) m="[$mac]" ;;
            *) m="[$win,$lin,$mac]" ;;
          esac

          {
            echo "matrix=$m"
            echo "tag=$tag"
            echo "profile=$prof"
          } >> "$GITHUB_OUTPUT"

      - name: 建目标 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          PROF: ${{ steps.plan.outputs.profile }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$TAG" != "latest" ]; then
            # 正式版本：git tag 已由 push 事件存在，这里只补上同名的 release。
            # 重复推同一个 tag（改代码后强制重打）时只补缺失的 release，不删已有附件、不碰 latest。
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              # Release 说明优先取 CHANGELOG.md 中对应版本的段落（## [x.y.z] 到下一个 ## 之间），
              # 没有对应段落时退回通用说明。包说明固定追加在最后。
              ver="${TAG#v}"
              notes_file="release-notes.md"
              if [ -f CHANGELOG.md ] && awk -v ver="$ver" '
                index($0, "## [" ver "]") == 1 { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md > "$notes_file" && [ -s "$notes_file" ]; then
                printf '\n\n---\n\n版本发布 %s，三平台各一个包：rumark-<平台>.zip（Windows）/ rumark-<平台>.tar.gz（Linux/macOS），解压即用，含可执行文件、README 和许可证。\n' "$TAG" >> "$notes_file"
              else
                echo "::warning::CHANGELOG.md 中没有版本 $ver 的段落，Release 说明使用通用文案；发布前请在 CHANGELOG.md 补充该版本的变化"
                printf '版本发布 %s，三平台各一个包：rumark-<平台>.zip（Windows）/ rumark-<平台>.tar.gz（Linux/macOS），解压即用，含可执行文件、README 和许可证。\n' "$TAG" > "$notes_file"
              fi
              gh release create "$TAG" --title "拾墨 Rumark $TAG" --notes-file "$notes_file"
            fi
            exit 0
          fi
          # 同名附件直接上传会冲突，全平台触发时删旧建新；单平台触发跳过，保留其他平台附件。
          if [ "$INPUT_PLATFORM" = "all" ]; then
            gh release delete latest --cleanup-tag -y || true
          fi
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "最新构建（手动触发，滚动更新）" --notes ""
          fi
          gh release edit latest --title "最新构建（手动触发，滚动更新）" --notes "编译档：$PROF（size 体积最小，release 速度优先）。

          滚动更新：全平台触发删旧建新；单平台触发只替换该平台附件，不碰其他的。
          每个平台一个包：rumark-<平台>.zip（Windows）/ .tar.gz（Linux/macOS），解压即用，含可执行文件、README 和许可证。
          说明：Windows 为主力验证平台；Linux/macOS 为交叉尝试编译，未在真机完整验证，遇到问题欢迎提 Issue。"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    # Linux/macOS 只是尝试编译：本机无对应设备验证，挂了也不阻塞其他平台发版。
    continue-on-error: ${{ matrix.best-effort }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # rgpui Linux 后端要 Wayland/X11 开发库。
      # Linux 故意钉在 22.04 runner：glibc 只能向前兼容，在越老的系统上编译，产物的基线越低（22.04 → glibc 2.35）。
      - name: 安装系统依赖（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libasound2-dev libudev-dev

      - name: 编译（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build -p rumark --profile ${{ needs.prepare.outputs.profile }}

      - name: 编译（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: cargo build -p rumark --profile "${{ needs.prepare.outputs.profile }}"

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prof = '${{ needs.prepare.outputs.profile }}'
          $stage = 'stage'
          New-Item -ItemType Directory -Force -Path 'dist', $stage | Out-Null
          Copy-Item -Path "target/$prof/rumark.exe", 'README.md', 'CHANGELOG.md', 'LICENSE-APACHE', 'NOTICE' -Destination $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/rumark-${{ matrix.name }}.zip"

      - name: 打包（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prof='${{ needs.prepare.outputs.profile }}'
          mkdir -p dist stage
          cp "target/$prof/rumark" stage/
          cp README.md CHANGELOG.md LICENSE-APACHE NOTICE stage/
          tar -czf "dist/rumark-${{ matrix.name }}.tar.gz" -C stage .

      - name: 发布附件（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ needs.prepare.outputs.tag }}' dist/*.zip --clobber

      - name: 发布附件（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ needs.prepare.outputs.tag }}' dist/*.tar.gz --clobber