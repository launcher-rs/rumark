# 持续集成：push / PR / 手动触发，只做静态检查（fmt + clippy）。
# 编译、冒烟与单测在本地按 CONTRIBUTING 的校验顺序跑，CI 不重复。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交会取消进行中的旧跑，省 runner 时长。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 静态检查：格式 + lint（含测试代码）。Linux 单跑，最快拿到"能不能合"的结论。
  lint:
    name: fmt + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # clippy 要完整编译一遍，系统依赖与本地构建一致；
      # Linux 故意钉 22.04（glibc 基线只升不降）。
      - name: 安装系统依赖（Linux）
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libasound2-dev libudev-dev

      - name: 格式检查（cargo fmt --check）
        shell: bash
        run: cargo fmt --check

      - name: 静态检查（cargo clippy --all-targets -- -D warnings）
        shell: bash
        run: cargo clippy --all-targets -- -D warnings